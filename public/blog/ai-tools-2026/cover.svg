<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AI tools dashboard illustration</title>
  <desc id="desc">A modern dashboard showing connected AI tool cards and automation lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset=".52" stop-color="#2563eb"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".96"/><stop offset="1" stop-color="#dbeafe" stop-opacity=".9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#020617" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <path d="M0 510C165 450 265 590 430 520S710 425 890 505s230 5 310-45v215H0z" fill="#020617" opacity=".18"/>
  <g stroke="#fff" stroke-opacity=".12"><path d="M0 96h1200M0 192h1200M0 288h1200M0 384h1200M0 480h1200M120 0v675M240 0v675M360 0v675M480 0v675M600 0v675M720 0v675M840 0v675M960 0v675M1080 0v675"/></g>
  <g filter="url(#shadow)">
    <rect x="120" y="105" width="960" height="465" rx="34" fill="url(#card)"/>
    <rect x="160" y="145" width="880" height="64" rx="18" fill="#0f172a"/>
    <circle cx="198" cy="177" r="9" fill="#ef4444"/><circle cx="230" cy="177" r="9" fill="#f59e0b"/><circle cx="262" cy="177" r="9" fill="#22c55e"/>
    <text x="600" y="185" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="#e2e8f0">Free AI Tools Workspace</text>
    <g font-family="Inter,Arial,sans-serif" font-weight="700" font-size="22" fill="#0f172a">
      <rect x="170" y="250" width="190" height="115" rx="22" fill="#bfdbfe"/><text x="265" y="316" text-anchor="middle">Write</text>
      <rect x="385" y="250" width="190" height="115" rx="22" fill="#ccfbf1"/><text x="480" y="316" text-anchor="middle">Search</text>
      <rect x="600" y="250" width="190" height="115" rx="22" fill="#fef3c7"/><text x="695" y="316" text-anchor="middle">Design</text>
      <rect x="815" y="250" width="190" height="115" rx="22" fill="#ede9fe"/><text x="910" y="316" text-anchor="middle">Code</text>
    </g>
    <path d="M265 365v55h645v-55M480 365v55M695 365v55" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" opacity=".55"/>
    <rect x="360" y="435" width="480" height="70" rx="24" fill="#0f172a"/>
    <text x="600" y="480" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#fff">One workflow. Ten useful tools.</text>
  </g>
</svg>