<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">AI coding assistant illustration</title><desc id="desc">A code editor with AI suggestions and highlighted code blocks.</desc><rect width="1200" height="675" fill="#020617"/><g opacity=".35"><circle cx="950" cy="130" r="180" fill="#2563eb"/><circle cx="220" cy="570" r="180" fill="#14b8a6"/></g><g filter="drop-shadow(0 28px 34px rgba(0,0,0,.35))"><rect x="160" y="105" width="880" height="465" rx="34" fill="#0d1117"/><rect x="160" y="105" width="880" height="62" rx="34" fill="#161b22"/><circle cx="205" cy="136" r="9" fill="#ff5f57"/><circle cx="237" cy="136" r="9" fill="#febc2e"/><circle cx="269" cy="136" r="9" fill="#28c840"/><g font-family="JetBrains Mono,Consolas,monospace" font-size="24" fill="#c9d1d9"><text x="230" y="240">function buildIdea() {</text><text x="280" y="300" fill="#7dd3fc">return</text><text x="380" y="300"> ai.suggest(code);</text><text x="230" y="360">}</text></g><rect x="620" y="230" width="300" height="190" rx="24" fill="#1f2937"/><text x="770" y="320" text-anchor="middle" font-family="Inter,Arial" font-size="24" font-weight="800" fill="#fff">Smart Code Help</text></g></svg>