<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">AI chat assistant illustration</title><desc id="desc">A chat assistant interface with intelligent message suggestions.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef2ff"/><stop offset="1" stop-color="#dbeafe"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#1e293b" flood-opacity=".16"/></filter></defs><rect width="1200" height="675" fill="url(#bg)"/><circle cx="1040" cy="105" r="160" fill="#60a5fa" opacity=".22"/><circle cx="170" cy="560" r="190" fill="#8b5cf6" opacity=".18"/><g filter="url(#s)"><rect x="210" y="100" width="780" height="475" rx="36" fill="#fff"/><rect x="250" y="145" width="700" height="58" rx="18" fill="#0f172a"/><text x="600" y="182" text-anchor="middle" font-family="Inter,Arial" font-size="24" font-weight="800" fill="#fff">AI Chat Assistant</text><rect x="280" y="250" width="420" height="54" rx="18" fill="#f1f5f9"/><rect x="500" y="330" width="420" height="54" rx="18" fill="#2563eb"/><rect x="280" y="410" width="500" height="54" rx="18" fill="#f1f5f9"/><text x="315" y="284" font-family="Inter,Arial" font-size="18" fill="#334155">Summarize this idea...</text><text x="535" y="364" font-family="Inter,Arial" font-size="18" fill="#fff">Here is a clear answer.</text><text x="315" y="444" font-family="Inter,Arial" font-size="18" fill="#334155">Make it shorter and sharper.</text><circle cx="305" cy="525" r="20" fill="#2563eb"/><circle cx="365" cy="525" r="20" fill="#14b8a6"/><circle cx="425" cy="525" r="20" fill="#8b5cf6"/></g></svg>